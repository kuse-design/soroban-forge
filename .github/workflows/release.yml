name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Build WASM Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Install stellar-cli
        # Pinned prebuilt binary: unpinned `cargo install` compiles for ~10
        # minutes and tracks latest (28.1.0 needs libdbus, absent on runners).
        # 28.0.0 matches the locally verified build toolchain.
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSfL \
            https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/stellar" --version
      # soroban-sdk 28 requires a spec-shaking build system (stellar-cli
      # 25.2+); plain `cargo build --target wasm32v1-none` is rejected by the
      # SDK build script.
      - name: Build contracts to WASM
        run: |
          # The workspace's cdylib crates are exactly the contract crates.
          stellar contract build --locked --profile release --optimize=false
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          found=0
          for wasm in target/wasm32v1-none/release/*.wasm; do
            cp "$wasm" artifacts/
            echo "Built $(basename "$wasm")"
            found=1
          done
          if [[ "$found" -eq 0 ]]; then
            echo "::error::no WASM artifacts produced — release aborted"
            exit 1
          fi
      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-forge-wasm-${{ github.ref_name }}
          path: artifacts/*.wasm
          retention-days: 90
          compression-level: 9

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*.wasm
